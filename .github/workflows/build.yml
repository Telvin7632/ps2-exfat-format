name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ps2:
    name: PS2 build (ps2dev/ps2dev:latest)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    defaults:
      run:
        shell: bash # GitHub runs it with -eo pipefail, so "make | tee" fails on errors
    steps:
      - name: Install build tools
        shell: sh
        run: apk add --no-cache build-base bash curl unzip git

      - uses: actions/checkout@v4

      - name: Build
        run: make 2>&1 | tee build.log

      - name: No compiler warnings
        run: "! grep -i 'warning:' build.log"

      - name: No unresolved symbols in the IRX
        run: |
          if mipsel-none-elf-nm iop/exfatfmt.notiopmod.elf | grep ' U '; then
            echo "unresolved symbols in exfatfmt.irx"; exit 1
          fi

      - name: Host stub matches PS2SDK struct block_device
        run: tests/host/check_bd_struct.sh

      - uses: actions/upload-artifact@v4
        with:
          name: exfat-format
          path: ee/exfat-format.elf
          if-no-files-found: error

  host-tests:
    name: Host tests + fsck.exfat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install exfatprogs
        run: sudo apt-get update && sudo apt-get install -y exfatprogs

      - name: make test (sparse images in /tmp)
        run: make test

      - name: fsck.exfat -n on every image (read-only loop devices)
        run: sudo tests/host/fsck_images.sh

      - name: Remove images
        if: always()
        run: make test-clean
